<!DOCTYPE html>
<html>
<head>
  <title>05-STAR</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #050505;
      color: white;
      text-align: center;
    }

    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .container {
      padding: 100px 20px;
    }

    h1 {
      font-size: 55px;
      color: #a855f7;
      text-shadow: 0 0 20px #a855f7;
    }

    img {
      width: 220px;
      filter: drop-shadow(0 0 20px #a855f7);
      animation: float 3s infinite;
    }

    @keyframes float {
      50% { transform: translateY(-10px); }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 25px;
      margin: 10px;
      border-radius: 12px;
      border: 1px solid #a855f7;
      background: rgba(255,255,255,0.05);
      color: white;
      cursor: pointer;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.1);
      background: #a855f7;
      box-shadow: 0 0 20px #a855f7;
    }

  </style>
</head>

<body>

<div id="particles-js"></div>

<div class="container">

  <img src="up.png">

  <h1>05-STAR</h1>

  <p>Comunidad gaming 🔥</p>

  <br>

  <!-- BOTONES -->
  <a class="btn" href="https://discord.gg/BfJUbKP4" target="_blank">
    <i class="fab fa-discord"></i> Discord
  </a>

  <a class="btn" href="https://wa.me/573234950793" target="_blank">
    <i class="fab fa-whatsapp"></i> WhatsApp
  </a>

  <button class="btn" onclick="toggleMusic()">
    <i class="fas fa-music"></i> Música
  </button>

</div>

<!-- AUDIO -->
<audio id="music" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio.mp3" type="audio/mp3">
</audio>

<!-- PARTICULAS -->
<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

<script>
particlesJS("particles-js", {
  particles: {
    number: { value: 60 },
    color: { value: "#a855f7" },
    size: { value: 3 },
    move: { speed: 1.5 },
    line_linked: { enable: true, color: "#a855f7" }
  }
});

// MUSICA
function toggleMusic() {
  let music = document.getElementById("music");
  if (music.paused) {
    music.play();
  } else {
    music.pause();
  }
}
</script>

</body>
</html>
