<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>05-STAR SYSTEM</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:monospace;}

body{
  background:black;
  color:#00ffcc;
  overflow:hidden;
}

/* MATRIX */
canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}

/* LOGIN */
#login{
  position:fixed;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:black;
}

input{
  margin:10px;
  padding:10px;
  background:black;
  border:1px solid #00ffcc;
  color:#00ffcc;
}

button{
  padding:10px 20px;
  border:1px solid #00ffcc;
  background:black;
  color:#00ffcc;
  cursor:pointer;
}

button:hover{
  background:#00ffcc;
  color:black;
}

/* CONTENIDO */
#contenido{
  display:none;
  text-align:center;
  padding:40px;
}

/* LOGO */
.logo{
  font-size:50px;
  animation:glitch 1s infinite;
}

@keyframes glitch{
  0%{text-shadow:2px 0 red;}
  50%{text-shadow:-2px 0 blue;}
  100%{text-shadow:0 0 10px #00ffcc;}
}

/* TEXTO */
.bio{
  max-width:600px;
  margin:20px auto;
  opacity:0.9;
}

/* BOTONES */
.btn{
  display:inline-block;
  margin:10px;
  padding:10px 20px;
  border:1px solid #00ffcc;
  color:#00ffcc;
  text-decoration:none;
}

.btn:hover{
  background:#00ffcc;
  color:black;
}

/* PANEL */
.panel{
  position:fixed;
  right:0;
  top:0;
  width:220px;
  height:100%;
  background:rgba(0,0,0,0.7);
  border-left:1px solid #00ffcc;
  font-size:12px;
  overflow:auto;
}

.error{color:red;}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<!-- LOGIN -->
<div id="login">
  <h2>ACCESS SYSTEM</h2>
  <input type="text" placeholder="usuario">
  <input type="password" placeholder="contraseña">
  <button onclick="entrar()">LOGIN</button>
</div>

<!-- CONTENIDO -->
<div id="contenido">

  <div class="logo">05-STAR</div>

  <p class="bio">
    >> Acceso concedido. Bienvenido al sistema 05-STAR.
    Comunidad enfocada en gaming competitivo, estrategia y desarrollo digital.
  </p>

  <a class="btn" href="https://discord.gg/BfJUbKP4" target="_blank">
    <i class="fab fa-discord"></i> Discord
  </a>

  <a class="btn" href="https://wa.me/573234950793" target="_blank">
    <i class="fab fa-whatsapp"></i> WhatsApp
  </a>

  <!-- WIDGET DISCORD -->
  <br><br>
  <iframe src="https://discord.com/widget?id=1494859008975179950&theme=dark"
  width="300" height="400"></iframe>

</div>

<!-- PANEL BUGS -->
<div class="panel" id="panel"><b>SYSTEM LOG</b></div>

<!-- AUDIO -->
<audio id="sound">
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_115b9bce3b.mp3">
</audio>

<script>

// LOGIN FAKE
function entrar(){
  document.getElementById("login").style.display="none";
  document.getElementById("contenido").style.display="block";
  document.getElementById("sound").play();
}

// MATRIX
let canvas = document.getElementById("matrix");
let ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

let letters = "01";
letters = letters.split("");

let fontSize = 14;
let columns = canvas.width / fontSize;
let drops = [];

for(let x=0;x<columns;x++) drops[x]=1;

function draw(){
  ctx.fillStyle="rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#0f0";
  ctx.font=fontSize+"px monospace";

  for(let i=0;i<drops.length;i++){
    let text=letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text,i*fontSize,drops[i]*fontSize);

    if(drops[i]*fontSize>canvas.height && Math.random()>0.975)
      drops[i]=0;

    drops[i]++;
  }
}

setInterval(draw,33);

// BUGS
const panel = document.getElementById("panel");

setInterval(()=>{
  let e=document.createElement("div");
  e.className="error";
  e.innerText="ERROR_"+Math.floor(Math.random()*999);
  panel.appendChild(e);
  panel.scrollTop=panel.scrollHeight;
},1500);

</script>

</body>
</html>
