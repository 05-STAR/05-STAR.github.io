<!DOCTYPE html>
<html>
<head>
  <title>05-STAR</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      background-size: 400% 400%;
      animation: fondo 10s ease infinite;
      font-family: Arial;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    @keyframes fondo {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    .container {
      background: rgba(0,0,0,0.6);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      max-width: 600px;
    }

    img {
      width: 150px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 20px white);
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .descripcion {
      font-size: 16px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      margin: 10px;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      font-size: 16px;
      transition: 0.3s;
    }

    .discord {
      background: #5865F2;
    }

    .whatsapp {
      background: #25D366;
    }

    .btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 15px white;
    }
  </style>
</head>

<body>

  <div class="container">
    
    <!-- LOGO -->
    <img src="up.png" alt="logo">

    <!-- TITULO -->
    <h1>05-STAR</h1>

    <!-- TEXTO EDITABLE -->
    <p class="descripcion">
    Hola bienvenidos a 05-star esta empresa hace eventos y juegos para que el publico se divierta claro siempre con premio 😁
    </p>

    <!-- BOTONES -->
    <a class="btn discord" href="https://discord.gg/GCNbavzj" target="_blank">
      Discord
    </a>

    <a class="btn whatsapp" href="https://wa.me/+57 323 4950793" target="_blank">
      WhatsApp
    </a>

  </div>

</body>
</html>
