<!DOCTYPE html>
<html>
<head>
  <title>05-STAR</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #050505;
      color: white;
      text-align: center;
    }

    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .container {
      padding: 100px 20px;
    }

    h1 {
      font-size: 55px;
      color: #a855f7;
      text-shadow: 0 0 20px #a855f7;
    }

    img {
      width: 220px;
      filter: drop-shadow(0 0 20px #a855f7);
      animation: float 3s infinite;
    }

    @keyframes float {
      50% { transform: translateY(-10px); }
    }

    .btn {
      padding: 12px 20px;
      margin: 10px;
      border-radius: 10px;
      border: 1px solid #a855f7;
      background: transparent;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #a855f7;
      box-shadow: 0 0 20px #a855f7;
    }

    /* PANEL DISCORD PRO */
    .panel {
      max-width: 400px;
      margin: 30px auto;
      background: #0f0f14;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 0 20px #a855f7;
      display: none;
    }

    .user {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1a22;
      margin: 10px 0;
      padding: 10px;
      border-radius: 10px;
      transition: 0.3s;
    }

    .user:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px #a855f7;
    }

    .user img {
      border-radius: 50%;
    }

    .user span {
      flex: 1;
      margin-left: 10px;
      text-align: left;
    }

    .online::after {
      content: "🟢";
    }

    .offline::after {
      content: "⚫";
    }

  </style>
</head>

<body>

<div id="particles-js"></div>

<div class="container">

  <img src="up.png">

  <h1>05-STAR</h1>

  <p>Comunidad gaming 🔥</p>

  <br>

  <a class="btn" href="https://discord.gg/BfJUbKP4" target="_blank">
    <i class="fab fa-discord"></i> Discord
  </a>

  <button class="btn" onclick="togglePanel()">
    👥 Ver miembros
  </button>

  <button class="btn" onclick="toggleMusic()">
    🎧 Música
  </button>

  <!-- PANEL MIEMBROS -->
  <div id="panel" class="panel">

    <div class="user online">
      <img src="https://i.pravatar.cc/40?img=1">
      <span>Jose</span>
    </div>

    <div class="user online">
      <img src="https://i.pravatar.cc/40?img=2">
      <span>Samu</span>
    </div>

    <div class="user offline">
      <img src="https://i.pravatar.cc/40?img=3">
      <span>Iker</span>
    </div>

    <div class="user online">
      <img src="https://i.pravatar.cc/40?img=4">
      <span>Tomxx</span>
    </div>

  </div>

</div>

<!-- AUDIO -->
<audio id="music">
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio.mp3" type="audio/mp3">
</audio>

<!-- PARTICULAS -->
<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

<script>
particlesJS("particles-js", {
  particles: {
    number: { value: 60 },
    color: { value: "#a855f7" },
    size: { value: 3 },
    move: { speed: 1.5 },
    line_linked: { enable: true, color: "#a855f7" }
  }
});

// PANEL MIEMBROS
function togglePanel() {
  let panel = document.getElementById("panel");
  panel.style.display = panel.style.display === "none" ? "block" : "none";
}

// MUSICA
function toggleMusic() {
  let music = document.getElementById("music");
  if (music.paused) {
    music.play();
  } else {
    music.pause();
  }
}
</script>

</body>
</html>
